<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 26 368 368" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Overhead view of a dinner table with one empty seat and a tipped glass</title>
  <defs>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B8945F" stop-opacity=".45"/>
      <stop offset="1" stop-color="#B8945F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset=".55" stop-color="#111315" stop-opacity="0"/>
      <stop offset="1" stop-color="#111315" stop-opacity=".78"/>
    </radialGradient>
  </defs>

  <!-- room floor -->
  <rect width="400" height="400" fill="#1F2022"/>

  <!-- chairs (top row) -->
  <g fill="#18191B" stroke="#38271D" stroke-width="2">
    <rect x="82"  y="52" width="56" height="30" rx="8"/>
    <rect x="172" y="52" width="56" height="30" rx="8"/>
    <rect x="262" y="52" width="56" height="30" rx="8"/>
  </g>

  <!-- chairs (bottom row); the middle one is pushed back and askew -->
  <g fill="#18191B" stroke="#38271D" stroke-width="2">
    <rect x="82"  y="318" width="56" height="30" rx="8"/>
    <rect x="262" y="318" width="56" height="30" rx="8"/>
    <rect x="168" y="346" width="56" height="30" rx="8" transform="rotate(-14 196 361)"/>
  </g>

  <!-- table -->
  <rect x="44" y="94" width="312" height="212" rx="14" fill="#4B3527" stroke="#38271D" stroke-width="4"/>
  <rect x="60" y="108" width="280" height="184" rx="8" fill="none" stroke="#B8945F" stroke-opacity=".28" stroke-width="1.5"/>

  <!-- table runner -->
  <rect x="60" y="188" width="280" height="24" fill="#8D3C40" fill-opacity=".55"/>

  <!-- candle glow + candles -->
  <circle cx="200" cy="200" r="64" fill="url(#candleGlow)"/>
  <circle cx="176" cy="200" r="5" fill="#F2E6CB"/>
  <circle cx="224" cy="200" r="5" fill="#F2E6CB"/>
  <circle cx="176" cy="200" r="2" fill="#B8945F"/>
  <circle cx="224" cy="200" r="2" fill="#B8945F"/>

  <!-- place settings, top row -->
  <g>
    <circle cx="110" cy="146" r="26" fill="#F2E6CB"/><circle cx="110" cy="146" r="16" fill="none" stroke="#E4D4B3" stroke-width="2"/>
    <circle cx="200" cy="146" r="26" fill="#F2E6CB"/><circle cx="200" cy="146" r="16" fill="none" stroke="#E4D4B3" stroke-width="2"/>
    <circle cx="290" cy="146" r="26" fill="#F2E6CB"/><circle cx="290" cy="146" r="16" fill="none" stroke="#E4D4B3" stroke-width="2"/>
  </g>
  <g stroke="#B8945F" stroke-width="2.5" stroke-linecap="round">
    <line x1="76"  y1="130" x2="76"  y2="162"/><line x1="144" y1="130" x2="144" y2="162"/>
    <line x1="166" y1="130" x2="166" y2="162"/><line x1="234" y1="130" x2="234" y2="162"/>
    <line x1="256" y1="130" x2="256" y2="162"/><line x1="324" y1="130" x2="324" y2="162"/>
  </g>

  <!-- place settings, bottom row (middle seat has no plate: the missing guest) -->
  <g>
    <circle cx="110" cy="254" r="26" fill="#F2E6CB"/><circle cx="110" cy="254" r="16" fill="none" stroke="#E4D4B3" stroke-width="2"/>
    <circle cx="290" cy="254" r="26" fill="#F2E6CB"/><circle cx="290" cy="254" r="16" fill="none" stroke="#E4D4B3" stroke-width="2"/>
  </g>
  <g stroke="#B8945F" stroke-width="2.5" stroke-linecap="round">
    <line x1="76"  y1="238" x2="76"  y2="270"/><line x1="144" y1="238" x2="144" y2="270"/>
    <line x1="256" y1="238" x2="256" y2="270"/><line x1="324" y1="238" x2="324" y2="270"/>
    <line x1="170" y1="238" x2="170" y2="270"/><line x1="230" y1="238" x2="230" y2="270"/>
  </g>
  <!-- crumpled napkin at the empty seat -->
  <path d="M184 246 l14 -8 l16 6 l-4 18 l-18 2 z" fill="#E4D4B3" stroke="#B8945F" stroke-opacity=".6" stroke-width="1.5"/>

  <!-- tipped wine glass and spill, beside the middle top plate -->
  <path d="M226 118 q30 6 44 24 q-14 14 -30 12 q-18 -6 -14 -36 z" fill="#8D3C40" fill-opacity=".7"/>
  <ellipse cx="236" cy="124" rx="14" ry="8" fill="none" stroke="#F2E6CB" stroke-opacity=".85" stroke-width="2" transform="rotate(-24 236 124)"/>
  <line x1="246" y1="128" x2="270" y2="140" stroke="#F2E6CB" stroke-opacity=".85" stroke-width="2" stroke-linecap="round"/>

  <!-- numbered evidence marker -->
  <g transform="translate(262 170) rotate(-6)">
    <path d="M0 22 L11 0 L22 22 Z" fill="#B8945F"/>
    <text x="11" y="19" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#111315" text-anchor="middle">1</text>
  </g>

  <!-- edge darkening -->
  <rect width="400" height="400" fill="url(#vignette)"/>
</svg>
