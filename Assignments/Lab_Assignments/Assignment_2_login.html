<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log In — Dhruvi Srivastava Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211c2b;
    --muted:#726c7d;
    --line:#e4e1ea;
    --accent:#5b3f8a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter', Arial, sans-serif;
    color:var(--ink);
  }
  .wrap{
    display:grid;
    grid-template-columns:1fr 1fr;
    min-height:100vh;
  }
  .promo{
    background:var(--accent);
    color:#fff;
    padding:60px 50px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
  }
  .promo::before{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    right:-90px;
    top:-90px;
  }
  .promo::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    left:-70px;
    bottom:-70px;
  }
  .promo .mark{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.5px;
    z-index:1;
  }
  .promo .quote{
    font-family:'Poppins',sans-serif;
    font-size:26px;
    font-weight:600;
    line-height:1.4;
    max-width:340px;
    z-index:1;
  }
  .promo .quote span{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:13.5px;
    margin-top:14px;
    color:#d9cff0;
  }
  .form-side{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
  }
  .card{width:100%; max-width:340px;}
  .card h1{
    font-family:'Poppins',sans-serif;
    font-size:23px;
    margin:0 0 6px;
  }
  .lede{
    font-size:14px;
    color:var(--muted);
    margin:0 0 30px;
  }
  .field{margin-bottom:22px;}
  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    margin-bottom:6px;
    color:#4c4757;
  }
  input[type="email"],
  input[type="password"]{
    width:100%;
    padding:8px 2px 10px;
    border:none;
    border-bottom:2px solid var(--line);
    font-size:14.5px;
    font-family:inherit;
    background:transparent;
  }
  input:focus{
    outline:none;
    border-bottom-color:var(--accent);
  }
  .row-between{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    margin-bottom:26px;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
  }
  .remember input{accent-color:var(--accent);}
  .row-between a{
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
  }
  button{
    width:100%;
    padding:13px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:999px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  button:hover{background:var(--accent);}
  .signup{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin-top:22px;
  }
  .signup a{
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
  }
  @media (max-width:760px){
    .wrap{grid-template-columns:1fr;}
    .promo{display:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="promo">
      <div class="mark">Dhruvi Srivastava</div>
      <div class="quote">
        Welcome back.
        <span>Log in to continue to your portfolio dashboard and manage your projects.</span>
      </div>
      <div></div>
    </div>

    <div class="form-side">
      <main class="card">
        <h1>Log in</h1>
        <p class="lede">Enter your details to continue.</p>

        <form action="#" method="post">
          <div class="field">
            <label for="login-email">Email address</label>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required>
          </div>

          <div class="row-between">
            <span class="remember">
              <input type="checkbox" id="remember" name="remember">
              <label for="remember" style="display:inline; font-weight:400; margin:0;">Remember me</label>
            </span>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit">Log in</button>
          <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
        </form>
      </main>
    </div>
  </div>
</body>
</html>
